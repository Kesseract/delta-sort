<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>delta-sort</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main class="app">
    <header class="hud">
      <span class="stat">手数 <b id="moves">0</b></span>
      <span class="stat" id="time">00:00</span>
      <span class="spacer"></span>
      <button id="undo" type="button">取り消し<kbd>Z</kbd></button>
      <button id="restart" type="button">やり直し<kbd>R</kbd></button>
      <button id="open-settings" type="button">設定</button>
    </header>
    <div id="board" class="board"></div>
    <div id="answer" class="answer" aria-label="正解の色"></div>
  </main>

  <dialog id="settings" class="panel">
    <div class="settings">
      <div class="wheel-box">
        <div id="wheel" class="wheel" role="button" aria-label="色相を選ぶ"></div>
        <div id="knob" class="knob"></div>
      </div>
      <div class="options">
        <div class="row"><span class="label">試験管の本数</span><span id="tube-options" class="group"></span></div>
        <div class="row"><span class="label">ベース色</span><button id="hue-random" type="button">ランダム</button><span class="note">色相環をクリックで固定</span></div>
        <div class="row"><span class="label">正解の色を表示</span><span class="group"><button id="answer-on" type="button">オン</button><button id="answer-off" type="button">オフ</button></span></div>
      </div>
    </div>
    <div class="actions"><button id="close-settings" type="button">閉じる</button></div>
  </dialog>

  <dialog id="clear" class="panel clear">
    <h2>CLEAR</h2>
    <div id="rank" class="rank"></div>
    <div class="stats">
      <div><span>手数</span><b id="clear-moves"></b> 手</div>
      <div><span>最短</span><b id="clear-optimal"></b> 手</div>
      <div><span>時間</span><b id="clear-time"></b></div>
    </div>
    <div class="actions"><button id="next" class="primary" type="button">次の問題</button></div>
  </dialog>
</body>
</html>
